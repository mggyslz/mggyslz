name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Download stats SVGs
        run: |
          mkdir -p assets

          for i in 1 2 3 4 5; do
            curl -f -s -o assets/stats.svg \
              "https://github-readme-stats.vercel.app/api?username=mggyslz&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true" \
              && grep -q "<svg" assets/stats.svg && echo "stats.svg OK" && break
            echo "Retry $i for stats.svg..." && sleep 10
          done

          for i in 1 2 3 4 5; do
            curl -f -s -o assets/langs.svg \
              "https://github-readme-stats.vercel.app/api/top-langs/?username=mggyslz&layout=compact&theme=tokyonight&hide_border=true&langs_count=8" \
              && grep -q "<svg" assets/langs.svg && echo "langs.svg OK" && break
            echo "Retry $i for langs.svg..." && sleep 10
          done

          for i in 1 2 3 4 5; do
            curl -f -s -o assets/streak.svg \
              "https://streak-stats.demolab.com?user=mggyslz&theme=tokyonight&hide_border=true" \
              && grep -q "<svg" assets/streak.svg && echo "streak.svg OK" && break
            echo "Retry $i for streak.svg..." && sleep 10
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore: update GitHub stats [skip ci]"
          git push
